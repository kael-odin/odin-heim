<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 占位头像贴纸：把 public/avatar.svg 换成你自己的头像 / IP 形象即可 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B7FD8"/>
      <stop offset="1" stop-color="#1E5BA8"/>
    </linearGradient>
  </defs>

  <!-- 背景圆盘 -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#F4D758" stroke-width="8" stroke-dasharray="2 18" stroke-linecap="round"/>

  <!-- 星星角色 -->
  <g transform="translate(200 208)">
    <path d="M0 -120l30 78 84 6-64 53 20 81-70-45-70 45 20-81-64-53 84-6z"
          fill="#F4D758" stroke="#1A1A2E" stroke-width="7" stroke-linejoin="round"
          transform="rotate(-8)"/>
    <!-- 脸 -->
    <circle cx="-22" cy="-10" r="9" fill="#1A1A2E"/>
    <circle cx="26" cy="-10" r="9" fill="#1A1A2E"/>
    <circle cx="-19" cy="-13" r="3" fill="#fff"/>
    <circle cx="29" cy="-13" r="3" fill="#fff"/>
    <path d="M-16 22q18 16 36 0" fill="none" stroke="#1A1A2E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-38" cy="12" r="8" fill="#E84A5F" opacity="0.55"/>
    <circle cx="42" cy="12" r="8" fill="#E84A5F" opacity="0.55"/>
  </g>

  <!-- 提示文字 -->
  <g font-family="'Noto Sans SC', sans-serif" text-anchor="middle">
    <rect x="92" y="330" width="216" height="40" rx="20" fill="#F4D758"/>
    <text x="200" y="357" font-size="22" font-weight="700" fill="#1A1A2E">替换我的头像</text>
  </g>
</svg>
